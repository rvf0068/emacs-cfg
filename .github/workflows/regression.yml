name: Emacs regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new commit makes an older PR run obsolete. Feature branches are tested
# by pull_request, so pushes to them do not start a duplicate workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Determine image refresh period
        id: image
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore prebuilt dependency image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emacs-regression-image.tar.gz
          key: emacs-regression-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.month }}-${{ hashFiles('.github/ci/Dockerfile') }}
      - name: Load or build the dependency image
        shell: bash
        run: |
          archive="$RUNNER_TEMP/emacs-regression-image.tar.gz"
          if [[ -f "$archive" ]]; then
            echo "Loading cached dependency image"
            time docker load --input "$archive"
          else
            echo "No cached image: building the external dependencies"
            time docker build --pull --tag emacs-regression:ci .github/ci
            # Cache only the dependency image, never the test checkout or home.
            time (docker save emacs-regression:ci | gzip -1 > "$archive")
            du -h "$archive"
          fi
          docker image inspect emacs-regression:ci --format 'Image {{.Id}}, bytes {{.Size}}'
      - name: Fingerprint package recipes
        id: package-recipes
        shell: bash
        run: |
          digest=$(docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            emacs-regression:ci emacs -Q --batch \
            --load tests/test-package-recipes.el \
            --eval '(prin1 (mapcar (lambda (form) (list (cadr form) (cadr (memq :straight (cddr form))))) (rvf/test-package-declarations "emacs-config.org")))' \
            | sha256sum | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Emacs source repositories
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/straight-source-cache
          key: straight-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.month }}-${{ steps.package-recipes.outputs.digest }}-${{ hashFiles('straight/versions/default.el', 'init.el', 'early-init.el', 'tests/test-package-recipes.el', 'tests/straight-source-cache.py') }}
      - name: Prepare source cache directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/straight-source-cache"
          # Cache extraction runs as the host user; Git must see repositories
          # owned by the container user before accepting local clones.
          docker run --rm --user root \
            --mount "type=bind,source=$RUNNER_TEMP/straight-source-cache,target=/ci-source-cache" \
            emacs-regression:ci chown -R ci:ci /ci-source-cache
      - name: Validate dependency diagnostics and run full regression
        shell: bash
        run: |
          time docker run --rm --init \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/straight-source-cache,target=/ci-source-cache" \
            --env RVF_TEST_REPOS_CACHE=/ci-source-cache \
            emacs-regression:ci bash -euo pipefail -c '
              make doctor EMACS=emacs UV_PROJECT=
              log=$(mktemp)
              if make doctor-unit EMACS=/nonexistent/emacs UV_PROJECT= > "$log" 2>&1; then
                echo "Missing executable was not detected" >&2
                exit 1
              fi
              cat "$log"
              grep -F "ERROR: Required executable not found: /nonexistent/emacs" "$log"
              rm -f "$log"
              time make test EMACS=emacs UV_PROJECT=
            '
