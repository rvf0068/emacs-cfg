name: Emacs regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install graphical Emacs and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-gtk xvfb xauth libzmq3-dev build-essential pkg-config libpoppler-glib-dev libpng-dev zlib1g-dev elpa-pdf-tools-server texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science dvisvgm latexmk biber aspell-en ripgrep
          emacs --version
          kpsewhich lxfonts.sty
          kpsewhich mylatexformat.ltx
          epdfinfo=$(find /usr -type f -name epdfinfo -print -quit)
          test -n "$epdfinfo"
          echo "RVF_EPDFINFO=$epdfinfo" >> "$GITHUB_ENV"
      - name: Install Python kernel and research dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-venv"
          "$RUNNER_TEMP/workflow-venv/bin/python" -m pip install jupyter ipykernel matplotlib numpy networkx
          echo "$RUNNER_TEMP/workflow-venv/bin" >> "$GITHUB_PATH"
      - name: Validate dependency diagnostics
        run: |
          make doctor
          if make doctor-unit EMACS=/nonexistent/emacs > "$RUNNER_TEMP/doctor-error.log" 2>&1; then
            echo "Missing executable was not detected" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/doctor-error.log"
          grep -F "ERROR: Required executable not found: /nonexistent/emacs" "$RUNNER_TEMP/doctor-error.log"
      - name: Run real Org workflows and ERT regression tests
        run: make test
